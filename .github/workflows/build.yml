name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Auth worker typecheck and test
        working-directory: worker
        run: |
          pnpm types
          pnpm typecheck
          pnpm test

      - name: Build
        run: pnpm build

      - name: Package
        id: package
        shell: pwsh
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'
          $zip = ./scripts/package.ps1
          $version = (Get-Content dist/manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Packaged $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wolt-splitwise-${{ steps.package.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: cloudflare-worker
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The consumer secret stays in Cloudflare; everything else comes from the cloudflare-worker environment.
      - name: Deploy auth worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SPLITWISE_CONSUMER_KEY: ${{ vars.SPLITWISE_CONSUMER_KEY }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN secret in the cloudflare-worker environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID variable in the cloudflare-worker environment}"
          : "${SPLITWISE_CONSUMER_KEY:?Set the SPLITWISE_CONSUMER_KEY variable in the cloudflare-worker environment}"
          pnpm exec wrangler deploy --var "SplitwiseConsumerKey:${SPLITWISE_CONSUMER_KEY}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wolt-splitwise-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts/*.zip).FullName --repo $env:GITHUB_REPOSITORY --generate-notes
