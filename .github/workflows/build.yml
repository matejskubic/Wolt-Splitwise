name: Build extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package
        id: package
        shell: pwsh
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'
          $zip = ./scripts/package.ps1
          $version = (Get-Content dist/manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Packaged $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: wolt-splitwise-${{ steps.package.outputs.version }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wolt-splitwise-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version 1.0
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem artifacts/*.zip).FullName --repo $env:GITHUB_REPOSITORY --generate-notes
