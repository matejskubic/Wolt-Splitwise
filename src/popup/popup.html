<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wolt to Splitwise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <div class="row" style="justify-content: space-between">
      <h1>Wolt → Splitwise</h1>
      <button id="open-options">Settings</button>
    </div>
    <div id="status" class="status">Loading…</div>

    <form id="review" class="hidden">
      <label><span>Description</span><input id="description" class="wide" required maxlength="120" /></label>
      <label><span>Splitwise group</span><select id="group-select" class="wide"></select></label>
      <div class="muted" id="group-info"></div>

      <div id="discount-box" class="hidden">
        <label><span>Per-person discounts from a saved checkout</span><select id="snapshot" class="wide"></select></label>
        <div id="discount-info" class="muted"></div>
        <details id="paste-box">
          <summary>Paste split amounts (CSV or JSON, after discounts, before fees)</summary>
          <textarea id="paste-input" class="wide" rows="5" placeholder='Matej Skubic,8.67&#10;Miha Boh,9.67&#10;&#10;or [{"name": "Matej Skubic", "amount": 8.67}]'></textarea>
          <div class="row"><button type="button" id="paste-apply">Apply pasted amounts</button></div>
          <div id="paste-status" class="status hidden"></div>
        </details>
      </div>

      <h2>Participants</h2>
      <table>
        <thead>
          <tr>
            <th>Wolt</th>
            <th>Splitwise member</th>
            <th class="num">Items</th>
            <th class="num">Discount</th>
            <th class="num">Fees</th>
            <th class="num">Owes</th>
          </tr>
        </thead>
        <tbody id="participants"></tbody>
      </table>

      <h2>Fees split across all participants</h2>
      <table>
        <tbody id="fees"></tbody>
      </table>
      <div class="row" style="margin-top: 6px"><button type="button" id="add-fee">Add fee</button></div>

      <h2>Payment</h2>
      <label><span>Paid by</span><select id="payer" class="wide"></select></label>
      <div id="summary" class="status"></div>
      <div class="row">
        <button type="submit" id="send" class="primary">Send to Splitwise</button>
      </div>
    </form>

    <script src="popup.js"></script>
  </body>
</html>
